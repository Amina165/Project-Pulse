<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse - Emergency Requests</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

  <div id="siteHeader"></div>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full flex-grow grid grid-cols-1 lg:grid-cols-12 gap-8">

    
    <div class="lg:col-span-5 bg-white p-6 rounded-3xl border border-gray-100 shadow-sm self-start">
      <div class="flex items-center gap-3 mb-6">
        <div class="w-10 h-10 rounded-xl bg-red-50 text-red-600 flex items-center justify-center text-lg">
          <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <div>
          <h2 class="text-lg font-extrabold text-gray-900">Post Urgent Request</h2>
          <p class="text-[11px] text-gray-400">Shown instantly to everyone on Pulse (login required to post)</p>
        </div>
      </div>

      <div id="requestAlert" class="hidden mb-4 p-3 rounded-xl text-xs font-bold text-center"></div>

      <form id="emergencyRequestForm" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Patient Name</label>
          <input type="text" id="patientName" placeholder="Full name of patient" class="w-full px-3 py-2.5 bg-gray-50 rounded-xl border border-gray-200 text-xs text-gray-800 focus:outline-none" required>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Blood Group Required</label>
          <select id="requiredBloodGroup" class="w-full px-3 py-2.5 bg-gray-50 rounded-xl border border-gray-200 text-xs text-gray-800 focus:outline-none" required>
            <option value="" disabled selected>Select Blood Group</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Bags Needed</label>
          <input type="number" id="unitsInput" min="1" max="20" value="2" class="w-full px-3 py-2.5 bg-gray-50 rounded-xl border border-gray-200 text-xs text-gray-800 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Hospital / Location</label>
          <input type="text" id="hospitalLocation" placeholder="Hospital name and city" class="w-full px-3 py-2.5 bg-gray-50 rounded-xl border border-gray-200 text-xs text-gray-800 focus:outline-none" required>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Contact Phone</label>
          <input type="tel" id="contactPhone" placeholder="+880 1XXXXXXXXX" class="w-full px-3 py-2.5 bg-gray-50 rounded-xl border border-gray-200 text-xs text-gray-800 focus:outline-none" required>
        </div>

        <button type="submit" class="w-full bg-red-600 hover:bg-red-700 disabled:opacity-60 text-white font-extrabold text-xs py-3 rounded-xl shadow-md transition-all flex items-center justify-center gap-2">
          <i class="fa-solid fa-paper-plane"></i> Publish Emergency Post
        </button>
      </form>
    </div>

    
    <div class="lg:col-span-7">
      <h2 class="text-xl font-extrabold text-gray-900 mb-4 flex items-center justify-between">
        <span>Live Emergency Stream</span>
        <span class="text-xs text-emerald-600 font-semibold flex items-center gap-1">
          <i class="fa-solid fa-wifi text-[10px]"></i> Realtime Active
        </span>
      </h2>

      <div id="requestsFeed" class="space-y-4">
        <div class="p-12 text-center text-gray-400 bg-white border border-gray-100 rounded-3xl">
          <i class="fa-solid fa-spinner fa-spin text-2xl text-red-600 mb-2"></i>
          <p class="text-xs font-bold text-gray-600">Connecting to real-time database...</p>
        </div>
      </div>
    </div>

  </main>

  <div id="siteFooter"></div>

  <script type="module" src="js/nav.js"></script>
  <script type="module" src="js/requests.js"></script>
</body>
</html>
